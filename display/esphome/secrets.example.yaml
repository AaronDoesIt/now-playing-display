# Copy to secrets.yaml (next to now-playing-display.yaml) and fill in.
# In the ESPHome add-on, put these in its shared secrets file instead.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"
ota_password: "choose-an-ota-password"
# 32 random bytes, base64. Generate one at https://esphome.io/components/api/
api_encryption_key: "REPLACE_WITH_A_GENERATED_KEY_FROM_THE_ESPHOME_DOCS="
mqtt_broker: "10.0.0.151"
mqtt_username: "an-mqtt-user"
mqtt_password: "that-users-password"
